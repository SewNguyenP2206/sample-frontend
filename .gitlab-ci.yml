stages:
  - deploy


build-and-push-docker-image:
  stage: deploy

  image: docker:24.0.5

  services:
    - docker:24.0.5-dind

  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"


  before_script:
    - |
      echo "Update package..."
      apk update

      echo "Install git..."
      apk add --no-cache git

      echo "Check git version..."
      git --version

      echo "Check Docker version..."
      docker --version

      echo "Login to GitLab Container Registry..."
      echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

      echo "Get latest commit name..."
      echo "Latest commit name: $CI_COMMIT_SHORT_SHA"

  script:
    - echo "Clone git repo..."
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/sewnguyenp2206-group/frontend_local.git
    - cd frontend_local
    - echo "Build Docker image..."
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - echo "Push Docker image..."
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"